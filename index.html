<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e9dcbe" />
<script>(function(){try{var t=localStorage.getItem("kh-theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
<title>Booklet — a library of notes on language models and agents</title>
<meta name="description" content="A personal library: notes on language models, retrieval, and agentic systems, searchable and cross-linked." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/shell.css" />
<style>
  /* Hero: the search field is the hero. Everything above it exists
     to say what is in the box; everything below is a way in for
     when you do not yet know what to type. */
  .hero { padding: var(--sp-8) 0 var(--sp-5); }

  .hero__title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.3rem, 8vw, 5.2rem);
    line-height: 0.98;
    letter-spacing: -0.015em;
    max-width: 15ch;
  }

  .hero__sub {
    margin-top: var(--sp-5);
    max-width: 54ch;
    font-size: 1.1rem;
    color: var(--text-muted);
  }

  .hero__finder { margin-top: var(--sp-6); max-width: 640px; }

  /* live results hang under the field rather than replacing the page —
     you can keep typing and watch the set narrow */
  .hits {
    margin-top: var(--sp-3);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--panel-raised);
    overflow: hidden;
  }

  .hits:empty { display: none; }

  .hit {
    display: flex;
    align-items: baseline;
    gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--line);
  }
  .hit:last-child { border-bottom: none; }
  .hit:hover { background: var(--panel); }

  .hit__where {
    font-family: var(--font-mono);
    font-size: 0.64rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    flex-shrink: 0;
    width: 92px;
  }

  .hit__title { font-weight: 600; }
  .hit.is-planned { opacity: 0.72; }
  .hit.is-planned:hover { background: none; }

  .hit__flag {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }

  .continue {
    display: flex;
    align-items: center;
    gap: var(--sp-5);
    padding: var(--sp-4) var(--sp-5);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ion);
    border-radius: var(--radius-sm);
  }

  .continue__body { flex: 1; min-width: 0; }
  .continue__title { font-weight: 600; font-size: 1.1rem; margin-top: 2px; }

  .spine { margin-top: var(--sp-7); }
</style>
</head>
<body>

<main>
  <section class="hero wrap">
    <span class="page-head__eyebrow enter-up" style="animation-delay:0ms">Personal library · AI research, systems, and the maths under both</span>
    <h1 class="hero__title enter-up" style="animation-delay:70ms">Everything I've worked out so far.</h1>
    <p class="hero__sub enter-up" style="animation-delay:160ms">
      Six tracks, mapped end to end — and filled in as I go. Search finds a note by what
      it says; the topography shows how they lean on each other.
    </p>

    <div class="hero__finder finder enter-up" style="animation-delay:240ms">
      <label class="finder__field" for="q">
        <span class="finder__glyph" aria-hidden="true">⌕</span>
        <input class="finder__input" id="q" type="search" autocomplete="off"
               placeholder="Search every note…" aria-label="Search every note" />
        <kbd class="finder__key">/</kbd>
      </label>
      <div class="hits" id="hits" role="listbox" aria-label="Search results"></div>
      <div class="finder__facets" id="facets"></div>
    </div>
  </section>

  <section class="wrap" id="continue-wrap" hidden>
    <hr class="rule" />
    <div class="section-head">
      <h2 class="section-head__title">Where you stopped</h2>
    </div>
    <div class="continue" id="continue"></div>
  </section>

  <section class="wrap spine">
    <div class="section-head">
      <h2 class="section-head__title">The shelf</h2>
      <span class="count-line" id="spine-count"></span>
    </div>
    <div class="deck" id="deck"></div>
  </section>

  <section class="wrap" style="margin-top:var(--sp-8)">
    <div class="section-head">
      <h2 class="section-head__title">Other ways in</h2>
    </div>
    <div class="bento" id="bento"></div>
  </section>

  <div id="foot"></div>
</main>

<script src="assets/js/theme.js"></script>
<script src="content/part-1.js"></script>
<script src="content/part-2.js"></script>
<script src="content/part-3.js"></script>
<script src="content/part-4.js"></script>
<script src="content/part-5.js"></script>
<script src="content/part-6.js"></script>
<script src="content/part-7.js"></script>
<script src="content/syllabus.js"></script>
<script src="content/notes.js"></script>
<script src="content/library.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  const L = window.Library;
  Shell.mount({ active: "home" });

  /* ---- the shelf: one stack per track ---- */
  document.getElementById("deck").innerHTML = L.tracks
    .map((t, i) => Shell.trackCard(t, i))
    .join("");

  /* States what is actually finished. 41 of 316 is the true number,
     and a library that overstates itself is worse than a small one. */
  document.getElementById("spine-count").innerHTML =
    `<strong>${L.counts.written}</strong> written of <strong>${L.counts.notes}</strong> outlined · ${L.counts.tracks} tracks`;

  /* ---- topic facets: the six largest, then a way to all of them ---- */
  /* not named `top` — that is window.top, and shadowing it at global
     scope is a redeclaration error rather than a shadow */
  const leadTopics = L.topics.slice().sort((a, b) => b.count - a.count).slice(0, 6);
  document.getElementById("facets").innerHTML =
    leadTopics
      .map(
        (t) =>
          `<a class="chip" href="browse.html?topic=${encodeURIComponent(t.id)}">${t.label}<span class="chip__n">${t.count}</span></a>`
      )
      .join("") + `<a class="chip" href="browse.html">All topics →</a>`;

  /* ---- live search ---- */
  const input = document.getElementById("q");
  const hits = document.getElementById("hits");

  function renderHits() {
    const q = input.value.trim();
    if (!q) { hits.innerHTML = ""; return; }
    const found = L.search(q).slice(0, 6);
    if (!found.length) {
      hits.innerHTML = `<div class="hit"><span class="hit__where">no match</span><span>Nothing yet on “${Shell.esc(q)}”. Try a broader word, or browse by topic.</span></div>`;
      return;
    }
    hits.innerHTML = found
      .map((n) => {
        /* a planned note has nothing behind it, so it is listed as a
           row rather than a link — it still tells you the ground is
           covered, without promising a page that does not exist */
        const tag = n.status === "planned" ? "div" : "a";
        const attr = n.status === "planned" ? ' class="hit is-planned"' : ` class="hit" href="${n.href}"`;
        return `<${tag}${attr}>
          <span class="hit__where">${Shell.esc(n.trackTitle || "Unfiled")}</span>
          <span><span class="hit__title">${Shell.esc(n.title)}</span>${
            n.short ? ` — <span style="color:var(--text-muted)">${Shell.esc(n.short)}</span>` : ""
          }${n.status === "planned" ? ` <span class="hit__flag">not written yet</span>` : ""}</span>
        </${tag}>`;
      })
      .join("");
  }


  input.addEventListener("input", renderHits);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      location.href = "browse.html?q=" + encodeURIComponent(input.value.trim());
    }
    if (e.key === "Escape") { input.value = ""; renderHits(); input.blur(); }
  });

  /* "/" focuses search from anywhere, the way it does on the sites
     this borrows from — but not while you are typing in something else */
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      input.focus();
    }
  });

  /* ---- where you stopped ---- */
  const lastId = (() => { try { return localStorage.getItem("booklet-last"); } catch (e) { return null; } })();
  const last = lastId && L.byId(lastId);
  if (last) {
    document.getElementById("continue-wrap").hidden = false;
    document.getElementById("continue").innerHTML = `
      <div class="continue__body">
        <span class="note-card__meta">${Shell.esc(last.moduleTitle || "Unfiled")}</span>
        <div class="continue__title">${Shell.esc(last.title)}</div>
      </div>
      <a class="btn-plate" href="${last.href}">Pick it up →</a>`;
  }

  /* ---- other ways in ---- */
  document.getElementById("bento").innerHTML = [
    { glyph: "◇", name: "Roadmap", desc: "The whole path as one shape, module by module.", href: "roadmap.html", tile: "var(--panel-raised)" },
    { glyph: "✳", name: "Topography", desc: "Which notes lean on which, by shared topic.", href: "topography.html", tile: "var(--panel)" },
    { glyph: "∑", name: "Decoder", desc: "Notation you can look up mid-paper.", href: "decoder.html", tile: "var(--panel-raised)" },
    { glyph: "▶", name: "Labs", desc: "Small things you can push on until they click.", href: "labs.html", tile: "var(--panel)" },
  ]
    .map(
      (t) => `<a class="bento-tile" href="${t.href}" style="--tile:${t.tile}">
        <span class="bento-tile__glyph" aria-hidden="true">${t.glyph}</span>
        <span>
          <span class="bento-tile__name">${t.name}</span>
          <span class="bento-tile__desc">${t.desc}</span>
        </span>
      </a>`
    )
    .join("");

  document.getElementById("foot").innerHTML = Shell.foot();
</script>
</body>
</html>
