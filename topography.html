<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e9dcbe" />
<script>(function(){try{var t=localStorage.getItem("kh-theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
<title>Topography — Booklet</title>
<meta name="description" content="Which notes lean on which, by shared topic — across every track." />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/shell.css" />
<style>
  .topo-bar {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    flex-wrap: wrap;
    margin-bottom: var(--sp-4);
  }

  .topo-search {
    flex: 1;
    min-width: 220px;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-4);
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-full);
  }

  .topo-search input {
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    font-size: 0.98rem;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
  }

  .topo-stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    overflow: hidden;
    touch-action: none;
  }

  .topo { width: 100%; height: auto; display: block; cursor: grab; }
  .topo.is-dragging { cursor: grabbing; }

  .topo-edge { stroke: var(--line); stroke-width: 0.8; opacity: 0.5; }
  .topo-edge.is-cross { stroke: var(--amber); stroke-dasharray: 3 3; opacity: 0.75; }

  .topo-node { cursor: pointer; }
  .topo-node circle {
    stroke: var(--panel);
    stroke-width: 1.2;
    transition: opacity var(--dur-fast);
  }
  /* an outlined note is hollow — the ring is there, the substance isn't */
  .topo-node.is-planned circle { fill: none; stroke-width: 1.6; }

  .topo-node.is-dim { opacity: 0.12; }
  .topo-edge.is-dim { opacity: 0.05; }

  .topo-label {
    font-family: var(--font-mono);
    font-size: 8px;
    fill: var(--text-muted);
    text-anchor: middle;
    pointer-events: none;
  }

  .topo-tip {
    position: absolute;
    transform: translate(-50%, -100%);
    background: var(--plate);
    color: var(--plate-text);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--radius-sm);
    max-width: 260px;
    pointer-events: none;
    z-index: 6;
  }

  .topo-tip__title { font-weight: 600; font-size: 0.9rem; line-height: 1.2; }
  .topo-tip__meta {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 3px;
  }

  .topo-legend {
    display: flex;
    gap: var(--sp-4);
    flex-wrap: wrap;
    margin-top: var(--sp-4);
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .topo-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .topo-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .topo-hint {
    position: absolute;
    left: var(--sp-3);
    bottom: var(--sp-3);
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    background: color-mix(in srgb, var(--void) 80%, transparent);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    pointer-events: none;
  }
</style>
</head>
<body>

<main>
  <div class="wrap">
    <div class="page-head">
      <span class="page-head__eyebrow">Cross-track</span>
      <h1 class="page-head__title">Topography</h1>
      <p class="page-head__sub">
        Every note, joined to the notes it shares topics with. The gold dashed lines are the interesting
        ones — those cross a track boundary, where two subjects turn out to be the same subject.
      </p>
    </div>

    <div class="topo-bar">
      <label class="topo-search">
        <span class="finder__glyph" aria-hidden="true">⌕</span>
        <input id="q" type="search" autocomplete="off" placeholder="Find a note and light up its neighbourhood…" aria-label="Search the graph" />
      </label>
      <button class="chip" type="button" id="cross-only" aria-pressed="false">Cross-track only</button>
      <button class="btn-quiet" type="button" id="reset">Reset</button>
    </div>

    <div class="topo-stage" id="stage">
      <div class="topo-hint">Drag a node · click to open</div>
    </div>

    <div class="topo-legend" id="legend"></div>
    <p class="count-line" id="count" style="margin-top:var(--sp-3)"></p>
  </div>

  <div id="foot"></div>
</main>

<script src="assets/js/theme.js"></script>
<script src="content/part-1.js"></script>
<script src="content/part-2.js"></script>
<script src="content/part-3.js"></script>
<script src="content/part-4.js"></script>
<script src="content/part-5.js"></script>
<script src="content/part-6.js"></script>
<script src="content/part-7.js"></script>
<script src="content/syllabus.js"></script>
<script src="content/notes.js"></script>
<script src="content/library.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/topo.js"></script>
<script>
  const L = window.Library;
  Shell.mount({ active: "map" });

  const stage = document.getElementById("stage");
  const edges = L.relations({ minWeight: 2 });

  /* Only notes that actually connect to something are drawn. An
     isolated dot on a relationship map is noise — it says nothing
     except that the keyword pass found nothing in common, and it
     pushes everything meaningful into a smaller corner. */
  const linked = new Set();
  edges.forEach((e) => { linked.add(e.source); linked.add(e.target); });
  const nodes = L.notes.filter((n) => linked.has(n.id)).map((n) => ({
    id: n.id, title: n.title, track: n.track, trackTitle: n.trackTitle,
    moduleTitle: n.moduleTitle, status: n.status, href: n.href, hue: n.hue,
    topics: n.topics,
  }));

  const sim = Topo.simulate(nodes, edges);
  const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));

  const adjacency = {};
  edges.forEach((e) => {
    (adjacency[e.source] = adjacency[e.source] || new Set()).add(e.target);
    (adjacency[e.target] = adjacency[e.target] || new Set()).add(e.source);
  });

  function draw() {
    const edgeSvg = edges
      .map((e, i) => {
        const a = pos[e.source], b = pos[e.target];
        if (!a || !b) return "";
        return `<line class="topo-edge${e.crossTrack ? " is-cross" : ""}" data-i="${i}"
                  data-a="${e.source}" data-b="${e.target}"
                  x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" />`;
      })
      .join("");

    const nodeSvg = nodes
      .map((n) => {
        const r = n.status === "written" ? 6 : 4;
        return `<g class="topo-node${n.status === "planned" ? " is-planned" : ""}" data-id="${n.id}">
            <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}"
                    style="fill:${Shell.hue(n.hue)};stroke:${n.status === "planned" ? Shell.hue(n.hue) : "var(--panel)"}" />
          </g>`;
      })
      .join("");

    stage.innerHTML = `
      <svg class="topo" viewBox="0 0 ${Topo.W} ${Topo.H}" role="img"
           aria-label="${nodes.length} notes connected by ${edges.length} shared-topic relations">
        <g id="edges">${edgeSvg}</g>
        <g id="nodes">${nodeSvg}</g>
      </svg>
      <div class="topo-hint">Drag a node · click to open</div>
      <div class="topo-tip" id="tip" hidden></div>`;
  }

  draw();

  const svg = stage.querySelector(".topo");
  const tip = document.getElementById("tip");

  /* ---- highlight a neighbourhood ---- */
  function focusOn(ids) {
    const set = ids && ids.size ? ids : null;
    stage.querySelectorAll(".topo-node").forEach((g) => {
      g.classList.toggle("is-dim", !!set && !set.has(g.dataset.id));
    });
    stage.querySelectorAll(".topo-edge").forEach((l) => {
      const on = !set || (set.has(l.dataset.a) && set.has(l.dataset.b));
      l.classList.toggle("is-dim", !on);
    });
  }

  function neighbourhood(id) {
    const s = new Set([id]);
    (adjacency[id] || []).forEach((x) => s.add(x));
    return s;
  }

  function showTip(node, el) {
    const box = stage.getBoundingClientRect();
    const dot = el.getBoundingClientRect();
    tip.innerHTML = `<div class="topo-tip__title">${Shell.esc(node.title)}</div>
      <div class="topo-tip__meta">${Shell.esc(node.trackTitle || "")}${node.status === "planned" ? " · not written yet" : ""}</div>`;
    tip.hidden = false;
    tip.style.left = `${dot.left - box.left + dot.width / 2}px`;
    tip.style.top = `${dot.top - box.top - 6}px`;
  }

  stage.addEventListener("mouseover", (e) => {
    const g = e.target.closest(".topo-node");
    if (!g) return;
    const node = pos[g.dataset.id];
    if (!node) return;
    showTip(node, g);
    focusOn(neighbourhood(node.id));
  });

  stage.addEventListener("mouseout", (e) => {
    if (e.target.closest(".topo-node")) {
      tip.hidden = true;
      if (!document.getElementById("q").value.trim()) focusOn(null);
    }
  });

  stage.addEventListener("click", (e) => {
    const g = e.target.closest(".topo-node");
    if (!g || dragMoved) return;
    const node = pos[g.dataset.id];
    if (node && node.href) location.href = node.href;
  });

  /* ---- drag ---------------------------------------------------
     Moving a node moves its edges with it, so you can pull a
     cluster out of the tangle to read it. Nothing re-simulates:
     the rest of the map stays where you learned it. */
  let dragging = null;
  let dragMoved = false;

  function svgPoint(evt) {
    const r = svg.getBoundingClientRect();
    return {
      x: ((evt.clientX - r.left) / r.width) * Topo.W,
      y: ((evt.clientY - r.top) / r.height) * Topo.H,
    };
  }

  svg.addEventListener("pointerdown", (e) => {
    const g = e.target.closest(".topo-node");
    if (!g) return;
    dragging = pos[g.dataset.id];
    dragMoved = false;
    svg.classList.add("is-dragging");
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const p = svgPoint(e);
    dragging.x = p.x;
    dragging.y = p.y;
    dragMoved = true;

    const g = stage.querySelector(`.topo-node[data-id="${CSS.escape(dragging.id)}"] circle`);
    if (g) { g.setAttribute("cx", p.x.toFixed(1)); g.setAttribute("cy", p.y.toFixed(1)); }

    stage.querySelectorAll(".topo-edge").forEach((l) => {
      if (l.dataset.a === dragging.id) { l.setAttribute("x1", p.x.toFixed(1)); l.setAttribute("y1", p.y.toFixed(1)); }
      if (l.dataset.b === dragging.id) { l.setAttribute("x2", p.x.toFixed(1)); l.setAttribute("y2", p.y.toFixed(1)); }
    });
  });

  svg.addEventListener("pointerup", () => {
    dragging = null;
    svg.classList.remove("is-dragging");
    window.setTimeout(() => { dragMoved = false; }, 0);
  });

  /* ---- search ---- */
  const q = document.getElementById("q");
  q.addEventListener("input", () => {
    const term = q.value.trim();
    if (!term) { focusOn(null); return; }
    const hits = L.search(term).map((n) => n.id).filter((id) => pos[id]);
    if (!hits.length) { focusOn(new Set(["__none__"])); return; }
    const set = new Set();
    hits.forEach((id) => neighbourhood(id).forEach((x) => set.add(x)));
    focusOn(set);
  });

  /* ---- cross-track only ---- */
  const crossBtn = document.getElementById("cross-only");
  crossBtn.addEventListener("click", () => {
    const on = crossBtn.getAttribute("aria-pressed") !== "true";
    crossBtn.setAttribute("aria-pressed", String(on));
    if (!on) { focusOn(null); return; }
    const set = new Set();
    edges.filter((e) => e.crossTrack).forEach((e) => { set.add(e.source); set.add(e.target); });
    focusOn(set);
  });

  document.getElementById("reset").addEventListener("click", () => {
    q.value = "";
    crossBtn.setAttribute("aria-pressed", "false");
    focusOn(null);
  });

  /* ---- legend + counts ---- */
  document.getElementById("legend").innerHTML =
    L.tracks
      .filter((t) => nodes.some((n) => n.track === t.id))
      .map((t) => `<span><i style="background:${Shell.hue(t.hue)}"></i>${Shell.esc(t.title)}</span>`)
      .join("") + `<span><i style="background:var(--amber)"></i>crosses tracks</span>`;

  document.getElementById("count").innerHTML =
    `<strong>${nodes.length}</strong> connected notes · <strong>${edges.length}</strong> relations · ` +
    `${edges.filter((e) => e.crossTrack).length} cross a track · ${L.counts.notes - nodes.length} notes have no shared topic yet`;

  document.getElementById("foot").innerHTML = Shell.foot();
</script>
</body>
</html>
