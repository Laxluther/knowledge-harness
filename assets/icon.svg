<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Knowledge Harness mascot: the wizard, drawn as pixel art on parchment.
       Palette sampled directly from assets/sprites/wizard.png. -->
  <rect width="16" height="16" rx="3" fill="#f2e8cf"/>
  <g fill="#af082d">
    <rect x="7" y="1" width="2" height="1"/>
    <rect x="6" y="2" width="4" height="2"/>
    <rect x="5" y="4" width="6" height="1"/>
    <rect x="4" y="5" width="8" height="1"/>
    <rect x="3" y="10" width="10" height="1"/>
    <rect x="2" y="11" width="12" height="3"/>
    <rect x="3" y="14" width="10" height="1"/>
  </g>
  <g fill="#f35c5c">
    <rect x="6" y="2" width="1" height="2"/>
    <rect x="5" y="4" width="1" height="1"/>
    <rect x="4" y="5" width="1" height="1"/>
    <rect x="3" y="10" width="1" height="1"/>
    <rect x="2" y="11" width="1" height="3"/>
  </g>
  <g fill="#3a072b">
    <rect x="2" y="6" width="12" height="1"/>
    <rect x="1" y="7" width="14" height="1"/>
    <rect x="4" y="8" width="8" height="2"/>
    <rect x="5" y="15" width="2" height="1"/>
    <rect x="9" y="15" width="2" height="1"/>
  </g>
  <g fill="#ffa19b">
    <rect x="6" y="8" width="1" height="1"/>
    <rect x="9" y="8" width="1" height="1"/>
  </g>
</svg>
