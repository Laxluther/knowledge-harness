<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e9dcbe" />
<script>(function(){try{var t=localStorage.getItem("kh-theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
<title>Dispatches - Knowledge Harness</title>
<meta name="description" content="A daily reading list of new work in LLMs and agentic AI, filtered against the book." />
<meta name="robots" content="noindex" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/articles.css" />
<link rel="stylesheet" href="assets/css/astronaut.css" />
</head>
<body>
<main id="articles-root"></main>

<script src="assets/js/progress.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/app.js"></script>
<script src="content/articles.js"></script>
<script>
  document.body.insertAdjacentHTML("afterbegin", App.buildStatusBar({ homeHref: "index.html" }));

  const list = window.ARTICLES || [];
  const updated = window.ARTICLES_UPDATED;
  const draftMode = new URLSearchParams(location.search).has("drafts");
  const shown = list.filter((a) => (draftMode ? a.status === "draft" : a.status !== "draft"));

  const fmt = (d) => {
    const dt = new Date(d);
    return isNaN(dt) ? "" : dt.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Group by the day the item was published.
  const groups = new Map();
  for (const a of shown) {
    const key = (a.date || "").slice(0, 10);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }
  const days = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));

  const card = (a) => `
    <li class="dispatch">
      <a class="dispatch__link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        <span class="dispatch__title">${esc(a.title)}</span>
      </a>
      <div class="dispatch__meta">
        <span class="dispatch__source">${esc(a.source)}</span>
        ${a.extends ? `<span class="dispatch__tag" title="Builds on a chapter you've written">extends ${esc(a.extends)}</span>` : ""}
      </div>
      ${a.excerpt ? `<p class="dispatch__excerpt">${esc(a.excerpt)}</p>` : ""}
    </li>`;

  document.getElementById("articles-root").innerHTML = `
    <header class="dispatch-hero container">
      <div class="eyebrow">${draftMode ? "Drafts &middot; not published" : "Dispatches"}</div>
      <h1>What's new since the book</h1>
      <p class="dispatch-hero__sub">
        A daily sweep of first-party playbooks, practitioner blogs and feeds, kept only when it
        goes beyond what the book already covers. Every entry links straight to the source -
        the titles and excerpts are the publishers' own words, not summaries.
      </p>
      <p class="dispatch-hero__stamp">
        ${updated ? `Last updated ${fmt(updated)}` : "Not run yet"} &middot; ${shown.length} item${shown.length === 1 ? "" : "s"}
      </p>
    </header>
    <div class="container dispatch-body">
      ${
        shown.length
          ? days
              .map(
                ([day, items]) => `
        <section class="dispatch-day">
          <h2 class="dispatch-day__label">${fmt(day) || "Undated"}</h2>
          <ul class="dispatch-list">${items.map(card).join("")}</ul>
        </section>`
              )
              .join("")
          : `<p class="dispatch-empty">Nothing yet. The agent writes here when it finds something that isn't already in the book.</p>`
      }
    </div>
    <footer class="dispatch-foot container">
      <a class="btn btn--ghost" href="index.html">&larr; Back to the map</a>
    </footer>`;
</script>
</body>
</html>
