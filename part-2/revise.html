<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e9dcbe" />
<script>(function(){try{var t=localStorage.getItem("kh-theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
<title>Prompting & Context Engineering — read straight through · Booklet</title>
<meta name="description" content="Every note in Prompting & Context Engineering on one page." />
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/tokens.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/shell.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/quest.css" />
<link rel="stylesheet" href="../assets/css/simple.css" />
<link rel="stylesheet" href="../assets/css/note.css" />
</head>
<body>
<main id="root"></main>
<div id="foot"></div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../content/part-1.js"></script>
<script src="../content/part-2.js"></script>
<script src="../content/part-3.js"></script>
<script src="../content/part-4.js"></script>
<script src="../content/part-5.js"></script>
<script src="../content/part-6.js"></script>
<script src="../content/part-7.js"></script>
<script src="../content/syllabus.js"></script>
<script src="../content/notes.js"></script>
<script src="../content/library.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
  /* One module, top to bottom, no quiz and no interaction — the
     version you read when you already know the material and just
     want it all in front of you. */
  const L = window.Library;
  const MODULE_ID = "part-2";
  Shell.mount({ active: "browse", prefix: "../" });

  const mod = L.module(MODULE_ID);
  const notes = L.notesIn(MODULE_ID);

  document.getElementById("root").innerHTML = `
    <div class="wrap wrap--narrow">
      <header class="note-head">
        <div class="crumb">
          <a href="../index.html">Shelf</a><span>/</span>
          <a href="../track.html?id=agentic">Language Models → Agentic AI</a><span>/</span>
          <span>Read straight through</span>
        </div>
        <span class="page-head__eyebrow">Module ${String(mod.n).padStart(2, "0")} · ${notes.length} notes</span>
        <h1 class="note-head__title">${Shell.esc(mod.title)}</h1>
        <p class="note-head__short">${Shell.esc(mod.tagline || "")}</p>
      </header>
      ${notes
        .map(
          (n) => `<section class="revise-chapter quest-section is-visible">
            <div class="quest-section__label"><span class="quest-section__icon">${String(n.n).padStart(2, "0")}</span><span class="eyebrow">${Shell.esc(n.title)}</span></div>
            ${n.plain ? `<div class="plain-note"><span class="plain-note__tag">In plain terms</span><div class="prose">${n.plain}</div></div>` : ""}
            <div class="prose">${n.hook}${n.explain}</div>
            <div class="prose">${n.analogy}</div>
            <ul class="quest-takeaways">${n.takeaways.map((t, i) => `<li><span class="quest-takeaways__mark">${i + 1}</span><span>${t}</span></li>`).join("")}</ul>
            <p style="margin-top:var(--sp-4)"><a class="btn-quiet" href="ch-${String(n.n).padStart(2, "0")}.html">Open with diagrams and self-check →</a></p>
          </section>`
        )
        .join("")}
    </div>`;

  document.getElementById("foot").innerHTML = Shell.foot({ prefix: "../" });
</script>
</body>
</html>
